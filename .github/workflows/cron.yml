# External cron pinger for Vercel Hobby tier (Vercel crons there fire at most
# once per day). Delete this once the project moves to Vercel Pro and
# vercel.json crons take over.
#
# Requires ONE repo secret: CRON_SECRET (same value as the Vercel env var).
# Until that secret exists, scheduled runs no-op successfully — no failure
# emails. APP_BASE_URL defaults to the production domain; a repo secret of
# the same name overrides it.
name: cron-pinger

on:
  schedule:
    - cron: "*/10 * * * *" # snapshot (GH Actions jitter: ±few minutes is fine)
    - cron: "15 * * * *"   # sync-catalog hourly
    - cron: "25 * * * *"   # settle-paper hourly (after sync-catalog)
    - cron: "45 */6 * * *" # match every 6h
    - cron: "0 13 * * 1"   # digest Monday 13:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Job to trigger (sync-catalog | snapshot | match | digest | settle-paper)"
        required: true
        default: "snapshot"

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'https://speedscout.vercel.app' }}
    steps:
      - name: Decide which job this schedule maps to
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "*/10 * * * *") echo "job=snapshot" >> "$GITHUB_OUTPUT" ;;
              "15 * * * *")   echo "job=sync-catalog" >> "$GITHUB_OUTPUT" ;;
              "25 * * * *")   echo "job=settle-paper" >> "$GITHUB_OUTPUT" ;;
              "45 */6 * * *") echo "job=match" >> "$GITHUB_OUTPUT" ;;
              "0 13 * * 1")   echo "job=digest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Trigger job route
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "CRON_SECRET repo secret not set — skipping. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$APP_BASE_URL/api/jobs/${{ steps.pick.outputs.job }}"
