# External cron pinger for Vercel Hobby tier (Vercel crons there fire at most
# once per day). Delete this once the project moves to Vercel Pro and
# vercel.json crons take over. Requires repo secrets:
#   APP_BASE_URL  e.g. https://spreadscout.vercel.app
#   CRON_SECRET   same value as the Vercel env var
name: cron-pinger

on:
  schedule:
    - cron: "*/10 * * * *" # snapshot (GH Actions jitter: ±few minutes is fine)
    - cron: "15 * * * *"   # sync-catalog hourly
    - cron: "45 */6 * * *" # match every 6h
    - cron: "0 13 * * 1"   # digest Monday 13:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Job to trigger (sync-catalog | snapshot | match | digest)"
        required: true
        default: "snapshot"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Decide which job this schedule maps to
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "*/10 * * * *") echo "job=snapshot" >> "$GITHUB_OUTPUT" ;;
              "15 * * * *")   echo "job=sync-catalog" >> "$GITHUB_OUTPUT" ;;
              "45 */6 * * *") echo "job=match" >> "$GITHUB_OUTPUT" ;;
              "0 13 * * 1")   echo "job=digest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Trigger job route
        run: |
          curl --fail-with-body -sS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/jobs/${{ steps.pick.outputs.job }}"
